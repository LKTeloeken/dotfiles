"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](color_mantle)\
$os\
$username\
[](bg:color_surface0 fg:color_mantle)\
$directory\
[](fg:color_surface0 bg:color_blue)\
$git_branch\
$git_status\
[](fg:color_blue bg:color_sapphire)\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:color_sapphire bg:color_overlay0)\
$docker_context\
$conda\
$pixi\
[](fg:color_overlay0 bg:color_base)\
$time\
[ ](fg:color_base)\
$line_break$character"""

palette = 'catppuccin_mocha'

[palettes.catppuccin_mocha]
color_fg = '#cdd6f4'
color_base = '#1e1e2e'
color_mantle = '#181825'
color_surface0 = '#313244'
color_overlay0 = '#6c7086'
color_blue = '#89b4fa'
color_sapphire = '#74c7ec'
color_green = '#a6e3a1'
color_red = '#f38ba8'
color_yellow = '#f9e2af'
color_purple = '#cba6f7'

[os]
disabled = false
style = "bg:color_mantle fg:color_fg"

[os.symbols]
Macos = "󰀵"
Linux = "󰌽"
Windows = "󰍲"

[username]
show_always = true
style_user = "bg:color_mantle fg:color_fg"
style_root = "bg:color_mantle fg:color_fg"
format = '[ $user ]($style)'

[directory]
style = "fg:color_fg bg:color_surface0"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol $branch ](fg:color_base bg:color_blue)]($style)'

[git_status]
style = "bg:color_blue"
format = '[[($all_status$ahead_behind )](fg:color_base bg:color_blue)]($style)'

[nodejs]
symbol = ""
style = "bg:color_sapphire"
format = '[[ $symbol( $version) ](fg:color_base bg:color_sapphire)]($style)'

[c]
symbol = " "
style = "bg:color_sapphire"
format = '[[ $symbol( $version) ](fg:color_base bg:color_sapphire)]($style)'

[cpp]
symbol = " "
style = "bg:color_sapphire"
format = '[[ $symbol( $version) ](fg:color_base bg:color_sapphire)]($style)'

[rust]
symbol = ""
style = "bg:color_sapphire"
format = '[[ $symbol( $version) ](fg:color_base bg:color_sapphire)]($style)'

[golang]
symbol = ""
style = "bg:color_sapphire"
format = '[[ $symbol( $version) ](fg:color_base bg:color_sapphire)]($style)'

[php]
symbol = ""
style = "bg:color_sapphire"
format = '[[ $symbol( $version) ](fg:color_base bg:color_sapphire)]($style)'

[java]
symbol = ""
style = "bg:color_sapphire"
format = '[[ $symbol( $version) ](fg:color_base bg:color_sapphire)]($style)'

[kotlin]
symbol = ""
style = "bg:color_sapphire"
format = '[[ $symbol( $version) ](fg:color_base bg:color_sapphire)]($style)'

[haskell]
symbol = ""
style = "bg:color_sapphire"
format = '[[ $symbol( $version) ](fg:color_base bg:color_sapphire)]($style)'

[python]
symbol = ""
style = "bg:color_sapphire"
format = '[[ $symbol( $version) ](fg:color_base bg:color_sapphire)]($style)'

[docker_context]
symbol = ""
style = "bg:color_overlay0"
format = '[[ $symbol( $context) ](fg:color_fg bg:color_overlay0)]($style)'

[conda]
style = "bg:color_overlay0"
format = '[[ $symbol( $environment) ](fg:color_fg bg:color_overlay0)]($style)'

[pixi]
style = "bg:color_overlay0"
format = '[[ $symbol( $version)( $environment) ](fg:color_fg bg:color_overlay0)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:color_base"
format = '[[  $time ](fg:color_fg bg:color_base)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:color_green)'
error_symbol = '[](bold fg:color_red)'
vimcmd_symbol = '[](bold fg:color_green)'
vimcmd_replace_one_symbol = '[](bold fg:color_purple)'
vimcmd_replace_symbol = '[](bold fg:color_purple)'
vimcmd_visual_symbol = '[](bold fg:color_yellow)'