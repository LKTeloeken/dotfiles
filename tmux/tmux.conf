### bootstrap TPM (apenas garante que o tpm existe)
set-environment -gF TMUX_PLUGIN_MANAGER_PATH '#{HOME}/dotfiles/tmux/plugins'

if 'test ! -d "#{TMUX_PLUGIN_MANAGER_PATH}/tpm"' {
  run 'git clone https://github.com/tmux-plugins/tpm "#{TMUX_PLUGIN_MANAGER_PATH}/tpm"'
}

### lista de plugins
set -g @plugin 'tmux-plugins/tpm'
# básicos
set -g @plugin 'tmux-plugins/tmux-yank'
# tema / estilo
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'dreknix/tmux-primary-ip'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# tooling
set -g @plugin 'omerxx/tmux-sessionx'

### opções catppuccin (podem vir antes do run do tpm)
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number_position 'right'
set -g @catppuccin_window_status 'no'
set -g @catppuccin_window_default_text '#W'
set -g @catppuccin_window_current_fill 'number'
set -g @catppuccin_window_current_text '#W'
set -g @catppuccin_window_current_color '#{E:@thm_surface_2}'
set -g @catppuccin_date_time_text '%d.%m. %H:%M'
set -g @catppuccin_status_module_text_bg '#{E:@thm_mantle}'

# source the plugin here
run '#{TMUX_PLUGIN_MANAGER_PATH}/tmux/catppuccin.tmux'

# módulos custom
source -F '#{d:current_file}/custom_modules/ctp_cpu.conf'
source -F '#{d:current_file}/custom_modules/ctp_memory.conf'
source -F '#{d:current_file}/custom_modules/primary_ip.conf'

### status bar
set -g allow-rename off
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 100
set -g status-right-length 100
set -g status-left '#{E:@catppuccin_status_session} '
set -gF status-right '#{E:@catppuccin_status_primary_ip}'
set -agF status-right '#{E:@catppuccin_status_ctp_cpu}'
set -agF status-right '#{E:@catppuccin_status_ctp_memory}'
if 'test -r /sys/class/power_supply/BAT*' {
  set -agF status-right '#{E:@catppuccin_status_battery}'
}
set -ag status-right '#{E:@catppuccin_status_date_time}'


### geral
# segundo prefix (comentário corrigido)
set -g prefix2 C-e
bind C-a send-prefix -2

set -g base-index 1
set -g pane-base-index 1
set -g renumber-window on

set -g xterm-keys on
set -as terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'
set -g @cursor_default 6

set -g mouse on
setw -g mode-keys vi

# Redimensionar pane com o prefix + seta
bind -r Left resize-pane -L 5
bind -r Down resize-pane -D 5
bind -r Up resize-pane -U 5
bind -r Right resize-pane -R 5

# Dividir janela em horizontal ou vertical
bind | split-window -h
bind - split-window -v

# Fechar painel ou janela
bind x kill-pane
bind X kill-window

# Reload da configuração
bind r source-file ~/.tmux.conf

# terminal (Ghostty suporta truecolor); se tiver terminfo tmux-256color use:
# set -g default-terminal 'tmux-256color'
set -g default-terminal 'screen-256color'
set -ag terminal-overrides ',xterm-256color*:RGB'

### inicializa TPM (não remova)
run '#{TMUX_PLUGIN_MANAGER_PATH}/tpm/tpm'

# (Opcional) auto-instalar plugins se ainda não clonados:
if '[ "$(ls -1 "#{TMUX_PLUGIN_MANAGER_PATH}" | wc -l)" -lt 3 ]' {
  run -b '#{TMUX_PLUGIN_MANAGER_PATH}/tpm/bin/install_plugins'
}
