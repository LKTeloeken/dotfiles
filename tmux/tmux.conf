# Enable 256-color and true-color (24-bit) support
# set -as terminal-features ",*:RGB"
# set -ag terminal-overrides ",xterm-256color:RGB"

# ---------------------------------------------------------------------------
# PREFIX = Alt + E
# ---------------------------------------------------------------------------
unbind C-b
set-option -g prefix C-e
bind-key C-e send-prefix

# split panes using | and - and set the path for them to be in the currently
# working directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

unbind '"'
unbind %

# Enter copy-mode com o prefixo
bind-key v copy-mode

# ---------------------------------------------------------------------------
# NAVEGAÇÃO ENTRE PANES: Ctrl+h/j/k/l SEM prefixo
# Isso já é entregue pelo plugin vim-tmux-navigator (christoomey/vim-tmux-navigator),
# que detecta automaticamente se o pane atual é vim/neovim: se for, encaminha
# a tecla pro vim navegar entre splits; se não for, troca de pane no tmux.
# Por isso não é necessário (e não deve ser feito) redefinir bind -n C-h/j/k/l
# aqui manualmente — o plugin já cuida disso de forma mais inteligente.
# ---------------------------------------------------------------------------
setw -g mode-keys vi

# Ações do dia a dia ficam atrás do prefixo (Ctrl+Space), já que Ctrl+letra
# sozinho é usado o tempo todo pelo shell/readline (Ctrl+R, Ctrl+A, Ctrl+L,
# Ctrl+W etc.) e não deve ser sequestrado globalmente.
bind-key x kill-pane
bind-key z resize-pane -Z
bind-key r command-prompt -I "#W" "rename-window '%%'"

# Resize de panes (repetível: segura o prefixo e aperta H/L várias vezes)
bind-key -r H resize-pane -L 5
bind-key -r L resize-pane -R 5

# Troca de sessão
bind-key J switch-client -n
bind-key K switch-client -p

# Navegação de janelas (prefix + , / .)
bind-key , previous-window
bind-key . next-window

# Ir direto pra janela N (prefix + número) — já é padrão do tmux, mantido
# aqui só por clareza/explicitação
bind-key 1 select-window -t 1
bind-key 2 select-window -t 2
bind-key 3 select-window -t 3
bind-key 4 select-window -t 4
bind-key 5 select-window -t 5

# Mover/reordenar janelas
bind-key < swap-window -t -1
bind-key > swap-window -t +1

# Nova janela no diretório atual
bind-key n new-window -c "#{pane_current_path}"

bind-key C new-window \; send-keys 'sd' C-m

set -s extended-keys on

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind P paste-buffer
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

set -s set-clipboard on

set-option -g status-position bottom

set -g mouse on

set -g base-index 1
set -g pane-base-index 1

set-option -g automatic-rename off
set-option -g renumber-windows on

set -s escape-time 10

# Performance
set -g monitor-activity off
set -g monitor-bell off
set -g monitor-silence 0
set -g status-interval 5
set -g aggressive-resize on
set -g history-limit 5000
set -g assume-paste-time 0
set -g visual-bell off
set -g visual-silence off

# ---------------------------------------------------------------------------
# Plugins
# ---------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'thewtex/tmux-mem-cpu-load'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'MunifTanjim/tmux-mode-indicator'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'omerxx/tmux-floax'

# ---------------------------------------------------------------------------
# STATUS BAR
#
# Antes era o plugin adibhanna/gruvbox-tmux. Ele usa array associativo
# (declare -A), que so existe no bash >= 4 — o macOS traz o bash 3.2, entao
# TODAS as cores do tema colapsavam pro mesmo valor e a barra ficava com
# fg == bg (texto invisivel). Aqui a status bar e montada na mao.
#
# As cores usam os indices da paleta do terminal (colour0..colour15), entao a
# barra continua acompanhando o tema do pywal automaticamente — so que com
# fg e bg sempre diferentes.
# ---------------------------------------------------------------------------
set -g status on
set -g status-justify left
set -g status-keys vi

set -g status-style 'bg=colour0,fg=colour7'

set -g status-left-length 60
set -g status-right-length 80

# Esquerda: indicador de modo + nome da SESSAO
set -g status-left '#{tmux_mode_indicator} #[fg=colour4,bg=colour0]#[fg=colour0,bg=colour4,bold] #S#[fg=colour4,bg=colour0,nobold,nodim] '

# Meio: lista de JANELAS (indice + nome), com a atual destacada
set -g window-status-separator ''
set -g window-status-format '#[fg=colour8,bg=colour0] #I #[fg=colour7]#W#{?window_zoomed_flag, ,} '
set -g window-status-current-format '#[fg=colour6,bg=colour0]#[fg=colour0,bg=colour6,bold] #I #W#{?window_zoomed_flag, ,} #[fg=colour6,bg=colour0,nobold,nodim] '
set -g window-status-activity-style 'fg=colour3,bg=colour0'
set -g window-status-bell-style 'fg=colour1,bg=colour0'

# Direita: diretorio atual + relogio
set -g status-right '#[fg=colour8,bg=colour0]#[fg=colour0,bg=colour8] #{b:pane_current_path} #[bold] %H:%M#[nobold]#[fg=colour8,bg=colour0]'

# Demais superficies (modo copia, mensagens, bordas)
set -g mode-style 'fg=colour0,bg=colour3'
set -g message-style 'fg=colour0,bg=colour4,bold'
set -g message-command-style 'fg=colour7,bg=colour0'
set -g pane-border-style 'fg=colour8'
set -g pane-active-border-style 'fg=colour4'
set -g display-panes-colour colour8
set -g display-panes-active-colour colour4

# Indicador de modo (tmux-mode-indicator)
# Os caps arredondados () vao dentro do proprio prompt, porque o plugin
# so aplica o *_mode_style ANTES do texto — nao teria como fechar o segmento.
# Por isso cada #[...] aqui traz um atributo so: o plugin injeta o prompt dentro
# de um #{?...,,} e o tmux quebra o condicional na primeira virgula, mesmo
# quando ela esta dentro de um bloco de estilo.
set -g @mode_indicator_empty_prompt '#[fg=colour8]#[bg=colour0]#[nobold]#[fg=colour0]#[bg=colour8]#[bold] NORMAL #[fg=colour8]#[bg=colour0]#[nobold]'
set -g @mode_indicator_prefix_prompt '#[fg=colour3]#[bg=colour0]#[nobold]#[fg=colour0]#[bg=colour3]#[bold] PREFIX #[fg=colour3]#[bg=colour0]#[nobold]'
set -g @mode_indicator_copy_prompt '#[fg=colour2]#[bg=colour0]#[nobold]#[fg=colour0]#[bg=colour2]#[bold] COPY #[fg=colour2]#[bg=colour0]#[nobold]'
set -g @mode_indicator_sync_prompt '#[fg=colour1]#[bg=colour0]#[nobold]#[fg=colour0]#[bg=colour1]#[bold] SYNC #[fg=colour1]#[bg=colour0]#[nobold]'

# --- tmux-fzf-url config ---
set -g @fzf-url-history-limit '2000'

# --- tmux-floax config ---
# Abre com prefix + p (não há mais atalho instantâneo, já que Ctrl+Space é
# uma combinação e não dá pra "empilhar" mais uma tecla no mesmo golpe)
set -g @floax-bind 'p'

# --- tmux-resurrect config ---
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'off'

# --- Gerenciador de sessoes (Ctrl+F, sem prefixo) ---
# Substitui o omerxx/tmux-sessionx, que abria um menu cheio de modos
# (tree/window/zoxide/config path/rename...). Aqui so tem o essencial:
#   enter  -> abre a sessao (criando a partir do projeto, se preciso)
#   ctrl-x -> mata a sessao
#   ctrl-o -> alterna a ordenacao (nome <-> uso recente)
# Os projetos vem das pastas fixas de scripts/tmux-project-dirs.sh.
bind-key -n C-f display-popup -E -w 60% -h 60% -T ' Sessions ' \
  "~/.config/tmux/../scripts/tmux-sessions.sh"

set -g @ton-open-strategy ":e"

# Initialize TMUX plugin manager (mantenha esta linha no final do arquivo)
run '~/.config/tmux/plugins/tpm/tpm'
